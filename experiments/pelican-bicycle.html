<!DOCTYPE html>

<title>鹈鹕，去兜风。 · SVG 骑行小景</title>
<style>
  :root { color-scheme: light; --ink:#284b42; --muted:#728276; --paper:#f4efdf; --accent:#db714d; }
  * { box-sizing:border-box; }
  html, body { margin:0; min-height:100%; }
  body {
    min-height:100svh; padding:28px; display:grid; place-items:center;
    background:var(--paper); color:var(--ink);
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  button { font:inherit; -webkit-tap-highlight-color:transparent; }
  .postcard {
    width:min(1400px,100%); position:relative; isolation:isolate;
    border:1px solid rgba(71,86,59,.13); border-radius:24px;
    box-shadow:0 24px 70px -35px rgba(63,70,39,.27),0 2px 6px rgba(63,70,39,.025);
    overflow:hidden; background:#f8ecd2;
  }
  .scene-wrap { position:relative; width:100%; aspect-ratio:1440 / 900; overflow:hidden; }
  #scene { display:block; width:100%; height:100%; }
  .masthead {
    position:absolute; top:28px; left:4.7%; right:4.7%;
    display:flex; justify-content:space-between; align-items:center;
    gap:16px; pointer-events:none;
  }
  .brand { display:flex; align-items:center; gap:10px; font-size:12px; font-weight:650; letter-spacing:2px; }
  .brand svg { width:27px; height:27px; }
  .edition { font-size:10px; letter-spacing:2.5px; font-weight:600; opacity:.63; }
  .story { position:absolute; top:14%; left:5.1%; pointer-events:none; }
  .eyebrow { display:flex; align-items:center; gap:9px; font-size:10px; letter-spacing:2px; font-weight:650; }
  .eyebrow::before { content:""; display:block; width:23px; height:2px; background:#db714d; }
  h1 {
    margin:22px 0 18px; font-size:clamp(34px,4.6vw,67px); line-height:1.22;
    letter-spacing:-2px; font-weight:800;
  }
  .story p { margin:0; font-size:13px; line-height:1.95; letter-spacing:1.5px; color:#758276; }
  .story .tiny { margin-top:29px; font-size:9px; letter-spacing:2.2px; color:#8e9584; }
  .bottom-bar {
    position:absolute; bottom:25px; left:4.7%; right:4.7%;
    display:flex; align-items:center; justify-content:space-between; gap:18px;
  }
  .caption { margin:0; display:flex; align-items:center; gap:9px; font-size:11px; letter-spacing:1px; color:#687263; }
  .caption-dot { width:6px; height:6px; border-radius:50%; background:#d47751; box-shadow:0 0 0 4px rgba(212,119,81,.10); }
  .controls {
    display:flex; align-items:center; gap:10px; padding:7px;
    background:rgba(255,251,237,.86); border:1px solid rgba(107,113,76,.14);
    border-radius:100px; box-shadow:0 5px 18px rgba(82,91,55,.055);
    backdrop-filter:blur(12px);
  }
  .toggle {
    height:36px; min-width:82px; padding:0 15px; border:none; border-radius:40px;
    background:var(--ink); color:#fff7e5; display:flex; align-items:center; justify-content:center;
    gap:7px; cursor:pointer; font-size:11px; letter-spacing:1px;
    transition:background .18s,transform .18s;
  }
  .toggle svg { width:13px; height:13px; fill:currentColor; }
  .toggle:hover { background:#3c6658; }
  .toggle:active { transform:scale(.97); }
  .divider { width:1px; height:19px; background:rgba(75,93,71,.16); }
  .speeds { display:flex; gap:3px; }
  .speed {
    border:none; border-radius:30px; background:transparent; color:#788170;
    padding:9px 12px; cursor:pointer; font-size:11px; white-space:nowrap;
    transition:background .18s,color .18s;
  }
  .speed:hover { color:var(--ink); background:rgba(86,111,76,.07); }
  .speed[aria-pressed="true"] { color:var(--ink); background:#e9ead7; font-weight:650; }
  button:focus-visible { outline:2px solid #d47751; outline-offset:4px; }
  .below { width:100%; text-align:center; font-size:9px; letter-spacing:2px; color:#9d9f8b; margin:16px 0 0; }
  .layout { width:min(1400px,100%); }
  .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
  @media (min-width:1600px) { body { padding:36px; } }
  @media (max-width:1000px) {
    body { padding:18px; }
    .masthead { top:22px; }
    .story { top:15%; }
    h1 { margin:17px 0 12px; }
    .story p { font-size:11px; }
    .story .tiny { margin-top:20px; font-size:8px; }
    .bottom-bar { bottom:18px; }
    .caption { font-size:9px; letter-spacing:0; }
    .toggle { height:33px; min-width:73px; padding:0 12px; }
    .speed { padding:8px 9px; font-size:10px; }
    .controls { gap:7px; padding:6px; }
  }
  @media (max-width:680px) {
    body { padding:13px; }
    .postcard { border-radius:20px; }
    .scene-wrap { aspect-ratio:960 / 1320; }
    .masthead { top:21px; left:7%; right:7%; }
    .brand { font-size:10px; letter-spacing:1.4px; gap:7px; }
    .brand svg { width:23px; height:23px; }
    .edition { font-size:8px; letter-spacing:1.3px; }
    .story { top:14%; left:7%; }
    .eyebrow { font-size:8px; letter-spacing:1.6px; }
    h1 { font-size:clamp(31px,8vw,49px); letter-spacing:-1.5px; margin:13px 0 10px; }
    h1 br { display:none; }
    .story p { font-size:10px; line-height:1.75; letter-spacing:1px; }
    .story p br { display:none; }
    .story .tiny { display:none; }
    .bottom-bar { flex-direction:column; gap:13px; bottom:19px; left:5%; right:5%; }
    .caption { order:2; font-size:9px; letter-spacing:.8px; }
    .controls { gap:9px; padding:6px; }
    .toggle { height:34px; min-width:75px; font-size:10px; }
    .speed { padding:9px 11px; font-size:10px; }
    .below { font-size:8px; letter-spacing:1px; margin-top:13px; }
  }
  @media (prefers-reduced-motion:reduce) { *,*::before,*::after { transition:none !important; } }
</style>

<script>
(() => {
  'use strict';

  // One clock drives the wheels, cranks, inverse-kinematic legs and parallax.
  // No libraries, network requests, raster assets, build steps or audio.
  const byId = id => document.getElementById(id);
  const el = Object.fromEntries([
    'scene','rearWheel','frontWheel','chainring','chain','farCrank','nearCrank',
    'nearCrankHighlight','farLeg','nearLeg','nearLegShine','farPedal','nearPedal',
    'rider','pelicanHead','eye','scarfTail','tailFeathers','basketFlowers',
    'clouds','hills','coast','road','foreground','ripples','boat','gulls','wind',
    'leafOne','leafTwo','toggle','toggleText','toggleIcon','liveStatus'
  ].map(id => [id, byId(id)]));

  const motionPreference = window.matchMedia('(prefers-reduced-motion: reduce)');
  const narrowScreen = window.matchMedia('(max-width: 680px)');
  const TAU = Math.PI * 2;
  const crank = { x:735, y:680, radius:44 };
  const wheelRadius = 107;
  const gearing = 1.35;
  let playing = !motionPreference.matches;
  let speed = 1;
  let desiredSpeed = 1;
  let sim = 0;
  let previousTime = null;
  let frameHandle = null;

  function transform(node, value) { node.setAttribute('transform', value); }
  function translate(node, x, y=0) { transform(node, `translate(${x.toFixed(2)} ${y.toFixed(2)})`); }

  // Two-link leg solution: knees bend forward, feet stay planted on the pedals.
  function legPath(hipX, hipY, footX, footY, upper, lower) {
    const dx = footX - hipX, dy = footY - hipY;
    const actual = Math.hypot(dx, dy);
    const d = Math.max(0.001, Math.min(actual, upper + lower - 0.001));
    const along = (upper * upper - lower * lower + d * d) / (2 * d);
    const bend = Math.sqrt(Math.max(0, upper * upper - along * along));
    const ux = dx / Math.max(actual, 0.001), uy = dy / Math.max(actual, 0.001);
    const kneeX = hipX + along * ux + bend * uy;
    const kneeY = hipY + along * uy - bend * ux;
    return `M${hipX.toFixed(2)} ${hipY.toFixed(2)}L${kneeX.toFixed(2)} ${kneeY.toFixed(2)}L${footX.toFixed(2)} ${footY.toFixed(2)}`;
  }

  function render(t) {
    const angle = t * TAU * 0.43;
    const degrees = angle * 180 / Math.PI;
    const distance = angle * gearing * wheelRadius;
    const bob = Math.sin(angle * 2) * 1.7;
    const frontX = crank.x + Math.cos(angle) * crank.radius;
    const frontY = crank.y + Math.sin(angle) * crank.radius;
    const backX = crank.x - Math.cos(angle) * crank.radius;
    const backY = crank.y - Math.sin(angle) * crank.radius;

    transform(el.rearWheel, `rotate(${(degrees * gearing) % 360})`);
    transform(el.frontWheel, `rotate(${(degrees * gearing) % 360})`);
    transform(el.chainring, `rotate(${degrees % 360})`);
    el.chain.setAttribute('stroke-dashoffset', (-angle * 35).toFixed(2));
    el.farCrank.setAttribute('d', `M735 680L${backX} ${backY}`);
    el.nearCrank.setAttribute('d', `M735 680L${frontX} ${frontY}`);
    el.nearCrankHighlight.setAttribute('d', `M735 678L${frontX} ${frontY-2}`);
    translate(el.farPedal, backX, backY);
    translate(el.nearPedal, frontX, frontY);
    el.farLeg.setAttribute('d', legPath(641,454+bob,backX-7,backY-9,163,155));
    const nearPath = legPath(658,456+bob,frontX-7,frontY-9,158,152);
    el.nearLeg.setAttribute('d', nearPath);
    el.nearLegShine.setAttribute('d', nearPath);

    translate(el.rider, 0, bob);
    transform(el.pelicanHead, `rotate(${Math.sin(angle*.5)*.8} 785 280)`);
    transform(el.scarfTail, `rotate(${-1+Math.sin(t*4.3)*2.2+Math.sin(t*2)*.8} 739 319)`);
    transform(el.tailFeathers, `rotate(${Math.sin(t*4.5)*1.7} 530 386)`);
    transform(el.basketFlowers, `rotate(${Math.sin(t*3)*1.6} 1025 486)`);

    // A brief blink every few seconds; only the pupil is squashed.
    const blinkPhase = t % 6.3;
    const blink = blinkPhase > 5.94 && blinkPhase < 6.12
      ? 1 - Math.sin((blinkPhase - 5.94) / .18 * Math.PI) * .94 : 1;
    transform(el.eye, `translate(825 222) scale(1 ${blink})`);

    translate(el.clouds, -(distance * .026 % 1440));
    translate(el.hills, -(distance * .058 % 1440));
    translate(el.coast, -(distance * .26 % 1440));
    translate(el.road, -(distance % 2160));
    translate(el.foreground, -(distance * 1.16 % 2160));
    el.ripples.setAttribute('patternTransform', `translate(${-distance*.13 % 440} 0)`);
    translate(el.boat, 1500 - ((1240 + distance*.105) % 1740), 612 + Math.sin(t*1.4)*1.6);
    translate(el.gulls, Math.sin(t*.17)*28, Math.sin(t*.85)*4);
    translate(el.wind, -Math.sin(t*2)*10);
    el.wind.setAttribute('opacity', (.35 + Math.sin(t*2)*.15).toFixed(3));

    const leafX = 1510 - ((distance*.86+1160) % 1740);
    const leafY = 722 + Math.sin(t*1.7)*17;
    transform(el.leafOne, `translate(${leafX} ${leafY}) rotate(${Math.sin(t*2)*30-15})`);
    const petalX = 1530 - ((distance*1.05+200) % 1790);
    transform(el.leafTwo, `translate(${petalX} ${744+Math.sin(t*1.4+1)*22}) rotate(${t*38 % 360})`);
  }

  function frame(now) {
    frameHandle = null;
    if (!playing || document.hidden) { previousTime = null; return; }
    const dt = previousTime === null ? 0 : Math.min((now - previousTime)/1000, .05);
    previousTime = now;
    // Speed changes ease in instead of snapping or moving the wheels backwards.
    speed += (desiredSpeed - speed) * (1 - Math.exp(-dt*5));
    sim += dt * speed;
    render(sim);
    frameHandle = requestAnimationFrame(frame);
  }

  function syncPlayback() {
    el.toggleText.textContent = playing ? '暂停' : '继续';
    el.toggle.setAttribute('aria-label', playing ? '暂停动画' : '继续动画');
    el.toggle.setAttribute('aria-pressed', String(!playing));
    el.toggleIcon.innerHTML = playing
      ? '<rect x="3" y="2.5" width="3.5" height="11" rx="1"/><rect x="9.5" y="2.5" width="3.5" height="11" rx="1"/>'
      : '<path d="M4 2.4c0-.6.6-.9 1.1-.6l8 5.4c.5.4.5 1 0 1.4l-8 5.4c-.5.3-1.1 0-1.1-.6Z"/>';
    if (frameHandle !== null) { cancelAnimationFrame(frameHandle); frameHandle = null; }
    previousTime = null;
    if (playing && !document.hidden) frameHandle = requestAnimationFrame(frame);
  }

  function togglePlayback() {
    playing = !playing;
    syncPlayback();
    el.liveStatus.textContent = playing ? '继续骑行' : '动画已暂停';
  }

  function fitScene() {
    // The mobile crop keeps the entire bicycle visible and reserves headline space.
    el.scene.setAttribute('viewBox', narrowScreen.matches ? '295 -255 960 1320' : '0 0 1440 900');
  }

  el.toggle.addEventListener('click', togglePlayback);
  document.querySelectorAll('.speed').forEach(button => {
    button.addEventListener('click', () => {
      desiredSpeed = Number(button.dataset.speed);
      document.querySelectorAll('.speed').forEach(other => {
        other.setAttribute('aria-pressed', String(other === button));
      });
      el.liveStatus.textContent = `骑行速度：${button.textContent}`;
    });
  });
  document.addEventListener('keydown', event => {
    const target = event.target;
    if (event.code === 'Space' && !event.repeat &&
        !(target instanceof Element && target.closest('button,input,textarea,select,[contenteditable]'))) {
      event.preventDefault();
      togglePlayback();
    }
  });
  document.addEventListener('visibilitychange', syncPlayback);
  motionPreference.addEventListener('change', event => {
    if (event.matches) { playing = false; syncPlayback(); }
  });
  narrowScreen.addEventListener('change', fitScene);

  fitScene();
  render(0);
  syncPlayback();
})();
</script>
</body>
</html>
