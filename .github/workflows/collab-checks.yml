name: Collaboration checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: collab-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  collab-checks:
    name: collab-checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Validate collaboration files
        run: npm run check
      - name: Test collaboration tools
        run: npm test
      - name: Check existing entry paths
        run: npm run doctor
      - name: Test publication boundaries
        run: npm run release:test
      - name: Build and inspect public-only artifact
        run: |
          npm run release:prepare
          npm run release:check
# No secrets, deployment, artifact execution, pull_request_target or self-hosted runner.
# This validates source and public artifacts; it does not certify natural gameplay or deploy Pages.
