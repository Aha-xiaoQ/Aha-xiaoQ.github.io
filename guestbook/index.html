<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小Q的便签墙</title><link rel="stylesheet" href="wall.css?v=20260907-guestbook-r2"><link rel="stylesheet" href="note-fit.css?v=20260907-note-spacing-r1"><link rel="stylesheet" href="wall-skin.css?v=20260907-guestbook-r2"><link rel="stylesheet" href="wall-nav.css?v=20260907-guestbook-r2"></head><body><main>
<header><nav class="wall-nav" aria-label="页面导航"><a class="wall-back" href="../about/">← 返回关于</a><div class="wall-language" data-i18n-skip><button type="button" data-lang="zh">中文</button><button type="button" data-lang="en">EN</button></div></nav><h1>小Q的便签墙</h1><p>留言审核后公开；请勿填写联系方式等隐私信息。</p></header><div class="desk">
<form id="composer"><h2>写一张便签</h2><label for="nick">昵称（可选）</label><input id="nick" maxlength="30"><div class="paper-options"><div><label for="color">自定义纸色</label><input id="color" type="color" value="#f7edb8" list="paper-colors"><datalist id="paper-colors"><option value="#f7edb8">奶黄</option><option value="#cdeafa">天蓝</option><option value="#f3d7e3">浅粉</option></datalist></div><div><label for="shape">形状</label><select id="shape"><option value="square">方形</option><option value="round">圆形</option><option value="heart">心形</option><option value="ticket">撕边长条</option></select></div></div><label for="message">留言</label><textarea id="message" required aria-describedby="counter"></textarea><p class="privacy-note">留言审核后公开。请勿填写联系方式等隐私信息。</p><p id="counter">0 / 500 字</p><button type="submit" class="primary">选择粘贴位置</button><p id="status" role="status"></p></form>
<section aria-label="互动便签墙"><div class="toolbar"><button id="out" aria-label="缩小">−</button><output id="zoom">100%</output><button id="in" aria-label="放大">＋</button><button id="fit">查看整面墙</button><button id="reset">实际大小</button><button id="cancel" hidden>取消粘贴</button><button id="center" hidden>贴在视野中央</button></div><p class="hint">拖动空白处移动墙面，滚轮缩放。拖动便签边缘调整位置；选中后也可用方向键移动。长留言可在便签内滚动查看。</p><div id="viewport" tabindex="0" aria-label="便签墙"><div id="world"><span class="wall-label">留一点灵感在这里</span></div></div><div class="selection"><span id="selection">墙上还没有便签</span><button id="remove" disabled>移除选中便签</button></div></section></div></main><script type="module" src="wall.js?v=20260907-guestbook-r2"></script><script defer src="/assets/site-analytics.js?v=20260907-r1"></script>
</body></html>
