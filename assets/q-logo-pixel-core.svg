<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="256" height="256" role="img" aria-labelledby="title desc">
  <title id="title">Xiao Q full-color pixel core</title>
  <desc id="desc">Transparent 16 by 16 blue-body and yellow-tail pixel Q without an outer frame.</desc>
  <g shape-rendering="crispEdges">
    <g id="q-body" fill="#009FE8">
      <rect x="2" y="0" width="1" height="1"/><rect x="3" y="0" width="1" height="1"/><rect x="4" y="0" width="1" height="1"/><rect x="5" y="0" width="1" height="1"/>
      <rect x="1" y="1" width="1" height="1"/><rect x="6" y="1" width="1" height="1"/>
      <rect x="0" y="2" width="1" height="1"/><rect x="7" y="2" width="1" height="1"/>
      <rect x="0" y="3" width="1" height="1"/><rect x="7" y="3" width="1" height="1"/>
      <rect x="0" y="4" width="1" height="1"/><rect x="7" y="4" width="1" height="1"/>
      <rect x="0" y="5" width="1" height="1"/><rect x="7" y="5" width="1" height="1"/>
      <rect x="0" y="6" width="1" height="1"/><rect x="7" y="6" width="1" height="1"/>
      <rect x="1" y="7" width="1" height="1"/>
      <rect x="2" y="8" width="1" height="1"/><rect x="3" y="8" width="1" height="1"/><rect x="4" y="8" width="1" height="1"/><rect x="5" y="8" width="1" height="1"/>
    </g>
    <g id="q-tail" fill="#F2C43E">
      <rect x="5" y="6" width="1" height="1"/><rect x="6" y="7" width="1" height="1"/><rect x="7" y="8" width="1" height="1"/><rect x="8" y="8" width="1" height="1"/>
    </g>
  </g>
</svg>
